name: Docs

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths: [docs/**, mkdocs.yml, pyproject.toml, src/gramps_mcp/goql_docs.md, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, pyproject.toml, src/gramps_mcp/goql_docs.md, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv run --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
