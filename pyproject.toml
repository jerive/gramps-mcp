[project]
name = "gramps-mcp"
version = "0.1.0"
description = "Unofficial MCP server exposing a Gramps Web API instance to LLM assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps]>=4.0.2",
    # FastMCP.from_openapi() takes an httpx2.AsyncClient (pydantic/httpx2), not httpx.
    "httpx2>=2.9.1",
    "tenacity>=9.1.4",
    "redis>=5.2.1",
    "py-key-value-aio[redis]>=0.4.6",
]

[project.urls]
Repository = "https://github.com/jerive/gramps-mcp"
Issues = "https://github.com/jerive/gramps-mcp/issues"

[project.scripts]
gramps-mcp = "gramps_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gramps_mcp"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
