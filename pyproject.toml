[project]
name = "gramps-mcp"
dynamic = ["version"]
description = "Unofficial MCP server exposing a Gramps Web API instance to LLM assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # >=4.1.0 for GoogleProvider's native cache_ttl_seconds/max_cache_size.
    "fastmcp[apps]>=4.1.0",
    # FastMCP.from_openapi() takes an httpx2.AsyncClient (pydantic/httpx2), not httpx.
    "httpx2>=2.9.1",
    "tenacity>=9.1.4",
    "redis>=5.2.1",
    "py-key-value-aio[redis]>=0.4.6",
]

[project.urls]
Repository = "https://github.com/jerive/gramps-mcp"
Issues = "https://github.com/jerive/gramps-mcp/issues"

[project.scripts]
gramps-mcp = "gramps_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/gramps_mcp"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.17.0"]
docs = ["mkdocs-material>=9.5", "mkdocs>=1.6,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
